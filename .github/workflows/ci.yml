name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: salubri, POSTGRES_PASSWORD: salubri, POSTGRES_DB: salubri_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salubri" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {version: "0.11.32"}  # même version qu'en local
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv pip install --system -r pyproject.toml pytest==9.2.0 pytest-cov==7.1.0 ruff==0.17.5 && uv pip install --system --no-deps -e .
      - run: ruff check salubri_api tests ../../scripts && ruff format --check salubri_api tests ../../scripts
      - run: python ../../scripts/livrable.py --verifier  # le dossier livrable/ doit refléter les sources
      # couverture : plancher = valeur mesurée au lot C (91 %), à ne jamais baisser
      - run: pytest -q --cov=salubri_api --cov-report=term --cov-fail-under=91
        env:
          SALUBRI_TEST_DATABASE_URL: postgresql+psycopg://salubri:salubri@localhost:5432/salubri_test

  # Lot C : interfaces — types, lint et tests unitaires (Vitest) de Salubri Map et Salubri Go.
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4"}
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm -r build

  # Lot A6 : dépendances vulnérables. Exceptions documentées : aucune à ce jour (voir docs/SECURITY.md).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit==2.10.1
      - name: pip-audit (dépendances de l'API)
        run: |
          python -c "import tomllib;print('\n'.join(tomllib.load(open('apps/api/pyproject.toml','rb'))['project']['dependencies']))" > /tmp/req.txt
          pip-audit -r /tmp/req.txt
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4"}
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit --prod (Salubri Map et Salubri Go)
        run: pnpm audit --prod

  # Lot B : un clone neuf démarre en une commande, sert les vraies interfaces et passe la répétition + e2e.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic
        run: sh run/doctor.sh || true
      - name: docker compose up --build (chronométré)
        run: |
          start=$(date +%s)
          docker compose up --build -d
          for i in $(seq 1 120); do curl -fs http://localhost/api/health && break; sleep 5; done
          curl -fs http://localhost/api/health
          echo "Démarrage à froid : $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Les vraies interfaces sont servies (pas la page d'attente)
        run: |
          curl -fs http://localhost/ | grep -q '/assets/index-'
          curl -fs http://localhost/go/ | grep -q '/go/assets/index-'
          curl -fsI http://localhost/ | grep -qi 'content-security-policy'
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v3
        with: {version: "0.11.32"}  # même version qu'en local
      - name: Outils de test
        run: |
          uv pip install --system -r apps/api/pyproject.toml pytest==9.2.0 playwright==1.65.2 && uv pip install --system --no-deps -e apps/api
          python -m playwright install --with-deps chromium
      - name: Répétition de la finale (scripts/rehearse.py)
        run: python scripts/rehearse.py --api http://localhost
        env: {PYTHONPATH: apps/api, SALUBRI_ADMIN_TOKEN: ouaga2026}
      - name: Tests navigateur (tests/e2e)
        run: pytest -q tests/e2e
        env: {SALUBRI_URL: "http://localhost"}
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=200
      - name: Arrêt
        if: always()
        run: docker compose down -v
