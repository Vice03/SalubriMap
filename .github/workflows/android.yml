# APK de débogage de Salubri Go (Capacitor, Android) : installable sur un téléphone, parle au serveur Salubri du réseau local.
name: Android
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/go}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4"}
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
        working-directory: .
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      # application + modèles de masquage dans dist/native, copiés dans le projet Android
      - run: SALUBRI_NATIVE=1 pnpm exec vite build
      - run: pnpm exec cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/go/android
      - uses: actions/upload-artifact@v4
        with:
          name: salubri-go-apk
          path: apps/go/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
