# Module « Assistant » : GPU NVIDIA pour le conteneur Ollama (ajouté par run/llm_detect.py seulement si nvidia-smi
# et le NVIDIA Container Toolkit sont présents). Sans ce fichier, le modèle tourne sur le processeur.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
