# /        -> Salubri Map + Sim (apps/web/dist)     /go/ -> Salubri Go PWA (apps/go/dist)
# /api/    -> FastAPI (SSE unbuffered)              /photos/ -> uploaded photos
# Until the front-ends are built, a placeholder page is served.
client_max_body_size 60m;

server {
  listen 80;
  server_name _;
  include /etc/nginx/salubri/locations.conf;
}

# HTTPS (certificat local auto-signé, généré dans l'image) : sur téléphone, le GPS exige une connexion
# sécurisée. Ouvrir https://<ip-du-pc>:8443/go/ et accepter l'avertissement une fois.
# Le plus fiable pour la démo reste le câble USB : run/telephone (adb reverse -> http://localhost/go/).
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/salubri/cert.pem;
  ssl_certificate_key /etc/nginx/salubri/key.pem;
  include /etc/nginx/salubri/locations.conf;
}
