# /        -> Salubri Map + Sim (apps/web/dist)     /go/ -> Salubri Go PWA (apps/go/dist)
# /api/    -> FastAPI (SSE unbuffered) ; les photos passent par l'API (lot A4)
# Until the front-ends are built, a placeholder page is served.
client_max_body_size 60m;   # imports de données (zip, GeoJSON) ; plus bas pour les signalements

# Lot 2.7 : compression. Salubri Go installe ~24 Mo (moteur WebAssembly 14,8 Mo + modèles 8 Mo) ; compressés,
# ~11 Mo sur le réseau du téléphone. Les photos (JPEG) ne sont pas recompressées.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/wasm application/javascript text/css application/json application/manifest+json
           image/svg+xml application/octet-stream;

# Limites par IP sur les POST seulement (lot A3) ; une clé vide n'est pas comptée, donc GET reste libre.
map $request_method $salubri_post_ip {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $salubri_post_ip zone=salubri_login:1m rate=10r/m;
limit_req_zone $salubri_post_ip zone=salubri_reports:5m rate=60r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  server_tokens off;
  error_page 429 = @trop;
  include /etc/nginx/salubri/security_headers.conf;
  include /etc/nginx/salubri/locations.conf;
}

# HTTPS (certificat local auto-signé, généré dans l'image) : sur téléphone, le GPS exige une connexion
# sécurisée. Ouvrir https://<ip-du-pc>:8443/go/ et accepter l'avertissement une fois.
# Le plus fiable pour la démo reste le câble USB : run/telephone (adb reverse -> http://localhost/go/).
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/salubri/cert.pem;
  ssl_certificate_key /etc/nginx/salubri/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  error_page 429 = @trop;
  include /etc/nginx/salubri/security_headers.conf;
  # HSTS seulement ici (TLS). Les navigateurs l'ignorent pour un certificat auto-signé ou une adresse IP.
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/salubri/locations.conf;
}
