# Relais vers l'API, commun à /api/ et aux emplacements limités (inclus par locations.conf).
resolver 127.0.0.11 ipv6=off valid=10s;
set $api_upstream api:8000;
proxy_pass http://$api_upstream;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;   # lu par l'API pour la limite de connexion (lot A3)
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;          # Server-Sent Events
proxy_cache off;
proxy_read_timeout 300s;
