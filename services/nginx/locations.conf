# Emplacements communs aux serveurs HTTP (80) et HTTPS (443), inclus par nginx.conf.
  location /api/ {
    include /etc/nginx/salubri/api_proxy.conf;
  }

  # Anti-force brute (lot A3) : 10 tentatives de connexion par minute et par IP, rafale de 5.
  location = /api/auth/login {
    limit_req zone=salubri_login burst=5 nodelay;
    client_max_body_size 8k;
    include /etc/nginx/salubri/api_proxy.conf;
  }

  # Anti-pourriel (lot A3) : 60 envois par minute et par IP (un téléphone qui vide sa file d'attente
  # passe), et un seul signalement avec une photo (12 Mo côté API) par requête.
  location = /api/reports {
    limit_req zone=salubri_reports burst=30 nodelay;
    client_max_body_size 13m;
    include /etc/nginx/salubri/api_proxy.conf;
  }

  location @trop {
    default_type application/json;
    return 429 '{"detail":"Trop de requêtes depuis cette adresse. Réessayez dans une minute."}';
  }

  location /photos/ {
    alias /srv/photos/;
    expires 7d;
    add_header Cache-Control "public";
  }

  location /go/ {
    alias /srv/go/;
    try_files $uri $uri/ /go/index.html @placeholder;
  }

  location / {
    root /srv/web;
    try_files $uri $uri/ /index.html @placeholder;
  }

  location @placeholder {
    root /srv/placeholder;
    try_files /index.html =404;
  }
