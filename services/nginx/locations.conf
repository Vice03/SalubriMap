# Emplacements communs aux serveurs HTTP (80) et HTTPS (443), inclus par nginx.conf.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # Server-Sent Events
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location /photos/ {
    alias /srv/photos/;
    expires 7d;
    add_header Cache-Control "public";
  }

  location /go/ {
    alias /srv/go/;
    try_files $uri $uri/ /go/index.html @placeholder;
  }

  location / {
    root /srv/web;
    try_files $uri $uri/ /index.html @placeholder;
  }

  location @placeholder {
    root /srv/placeholder;
    try_files /index.html =404;
  }
