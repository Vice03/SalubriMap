# En-têtes de sécurité (lot A6), inclus dans les deux serveurs de nginx.conf.
# Aucun « add_header » dans locations.conf : sinon nginx n'hériterait plus de ceux-ci.
# CSP : MapLibre a besoin de workers blob: et des tuiles OSM / satellite (fond de carte) ;
# React pose des attributs style, d'où 'unsafe-inline' pour les styles seulement (jamais pour les scripts).
# 'wasm-unsafe-eval' : compiler le WebAssembly du masquage des visages et plaques (Salubri Go) ; n'autorise pas eval().
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self' https://tile.openstreetmap.org https://server.arcgisonline.com; worker-src 'self' blob:; child-src 'self' blob:; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
