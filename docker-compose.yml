# Salubri — one command: `docker compose up --build`
# Order: db (healthy) -> seed (one-shot, idempotent) -> api (healthy) -> web (nginx on port 80).
# OSRM is optional (profile "osrm"): without it the API uses straight-line distances.
#   Start with routing: docker compose --profile osrm up --build

name: salubri

x-api-env: &api-env
  SALUBRI_DATABASE_URL: postgresql+psycopg://salubri:salubri@db:5432/salubri
  SALUBRI_OSRM_URL: http://osrm:5000
  SALUBRI_OSRM_RAIN_URL: http://osrm_rain:5000
  SALUBRI_DATA_DIR: /app/data
  SALUBRI_PHOTOS_DIR: /app/var/photos
  SALUBRI_MASKING_MODELS_DIR: /app/masking_models  # masquage des visages et plaques (volume ci-dessous)
  SALUBRI_COMMUNE: ${SALUBRI_COMMUNE:-ouagadougou}
  SALUBRI_CORS_ORIGINS: ${SALUBRI_CORS_ORIGINS:-}
  # code d'accès mairie (modération, imports, scénarios) : à changer via un fichier .env
  SALUBRI_ADMIN_TOKEN: ${SALUBRI_ADMIN_TOKEN:-}
  # démonstration par défaut (compte demo / code ouaga2026, badge visible) ; false = production : l'API refuse
  # de démarrer sans secrets propres (run/start les génère dans .env) ni compte admin (run/admin le crée)
  SALUBRI_DEMO_MODE: ${SALUBRI_DEMO_MODE:-true}
  SALUBRI_SECRET_KEY: ${SALUBRI_SECRET_KEY:-}
  # modules optionnels (docs/MODULES.md), éteints par défaut
  SALUBRI_SEASONS_ENABLED: ${SALUBRI_SEASONS_ENABLED:-false}
  SALUBRI_ASSISTANT_ENABLED: ${SALUBRI_ASSISTANT_ENABLED:-false}
  SALUBRI_LLM_URL: ${SALUBRI_LLM_URL:-http://ollama:11434/v1}
  SALUBRI_LLM_MODEL: ${SALUBRI_LLM_MODEL:-qwen2.5:7b-instruct}
  SALUBRI_LLM_API_KEY: ${SALUBRI_LLM_API_KEY:-}
  SALUBRI_LLM_AUTO: ${SALUBRI_LLM_AUTO:-true}
  # brigade Laabal : transmission automatique des dépotoirs récidivistes et numéro WhatsApp (fictif par défaut)
  SALUBRI_LAABAL_AUTO: ${SALUBRI_LAABAL_AUTO:-true}
  SALUBRI_LAABAL_WHATSAPP: ${SALUBRI_LAABAL_WHATSAPP:-+22600000000}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: salubri
      POSTGRES_PASSWORD: salubri
      POSTGRES_DB: salubri
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    # base et API joignables depuis ce PC seulement (lot A6) ; le téléphone passe par nginx (80 / 8443)
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salubri -d salubri"]
      interval: 5s
      timeout: 3s
      retries: 30

  osrm:
    build: ./services/osrm
    profiles: ["osrm"]
    environment:
      OSRM_PROFILE: /profiles/car.lua
    volumes:
      - ./data/osm:/data/osm:ro
      - osrm:/osrm
    healthcheck: &osrm-health
      # le premier démarrage prépare le graphe routier (plusieurs minutes) : start_period long
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 900s

  osrm_rain:
    build: ./services/osrm
    profiles: ["osrm"]
    environment:
      OSRM_PROFILE: /profiles/car_rain.lua
    volumes:
      - ./data/osm:/data/osm:ro
      - osrm:/osrm
    healthcheck: *osrm-health

  seed:
    build: ./apps/api
    environment: *api-env
    command: ["python", "-m", "salubri_api.seed.run"]
    volumes:
      - ./data:/app/data:ro
      - photos:/app/var/photos
      - ./apps/go/public/models:/app/masking_models:ro  # masquage : mêmes modèles que Salubri Go
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    build: ./apps/api
    environment: *api-env
    volumes:
      - ./data:/app/data:ro
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro  # module « Assistant » : documents de référence cherchés par l'assistant
      - photos:/app/var/photos
      - ./apps/go/public/models:/app/masking_models:ro  # masquage : mêmes modèles que Salubri Go
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    # module « Assistant » : un modèle local lancé sur la machine (LM Studio, Ollama…) est joint par ce nom
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
      seed: {condition: service_completed_successfully}

  web:
    # construit apps/web et apps/go dans l'image (aucun Node requis sur la machine)
    build: {context: ., dockerfile: services/nginx/Dockerfile}
    ports: ["${WEB_PORT:-80}:80", "${WEB_TLS_PORT:-8443}:443"]
    # pas de volume photos : nginx ne sert plus les photos, l'API les filtre (lot A4)
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ && wget -qO /dev/null http://127.0.0.1/go/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Module « Assistant » (profil « assistant », absent de la pile par défaut) : modèle de langue local, rien sur
  # la machine hôte. Les modèles téléchargés restent dans le volume « ollama ». run/llm_detect.py s'en sert.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["assistant"]
    volumes: ["ollama:/root/.ollama"]
    ports: ["127.0.0.1:11434:11434"]
    restart: unless-stopped

volumes:
  ollama:
  pgdata:
  osrm:
  photos:
